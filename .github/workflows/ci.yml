name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest
        run: npm run validate:manifest

      - name: Unit / regression tests
        run: npm run test:regressions

      - name: Install Chromium for Puppeteer
        run: |
          set -euo pipefail
          resolve_browser() {
            if [ -x /usr/bin/google-chrome-stable ]; then
              echo "/usr/bin/google-chrome-stable"
            elif [ -x /usr/bin/google-chrome ]; then
              echo "/usr/bin/google-chrome"
            elif [ -x /usr/bin/chromium-browser ]; then
              echo "/usr/bin/chromium-browser"
            elif [ -x /usr/bin/chromium ]; then
              echo "/usr/bin/chromium"
            else
              return 1
            fi
          }

          if BROWSER="$(resolve_browser)"; then
            echo "Using existing browser: $BROWSER"
          else
            echo "No system Chrome/Chromium found — installing"
            sudo apt-get update
            # Fail loudly if neither package can be installed
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            if ! BROWSER="$(resolve_browser)"; then
              echo "Apt packages present but binary missing — downloading Chrome via @puppeteer/browsers"
              npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/chrome-ci"
              BROWSER="$(find "$HOME/chrome-ci" -type f -name chrome -executable | head -1 || true)"
              if [ -z "${BROWSER}" ]; then
                echo "::error::No Chrome/Chromium binary available after install attempts"
                exit 1
              fi
            fi
          fi

          echo "NODAYSRAMMAR_BROWSER=${BROWSER}" >> "$GITHUB_ENV"
          echo "NODAYSRAMMAR_BROWSER=${BROWSER}"

      - name: Install xvfb for headed MV3 extension tests
        run: sudo apt-get install -y xvfb

      - name: Live extension tests (headed under xvfb)
        run: xvfb-run -a npm test
        env:
          NODAYSRAMMAR_BROWSER: ${{ env.NODAYSRAMMAR_BROWSER }}

      - name: Auto-fix workflow tests (headed under xvfb)
        run: xvfb-run -a npm run test:autofix
        env:
          NODAYSRAMMAR_BROWSER: ${{ env.NODAYSRAMMAR_BROWSER }}
